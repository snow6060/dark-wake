name: Build and sign Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-sign:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dark-wake/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dark-wake

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
        working-directory: dark-wake

      - name: Locate installer
        id: installer
        shell: pwsh
        working-directory: dark-wake
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag '$env:GITHUB_REF_NAME' must match the app version tag 'v$version'."
          }
          $path = "src-tauri/target/release/bundle/nsis/dark-wake_${version}_x64-setup.exe"
          if (-not (Test-Path $path)) {
            throw "Expected NSIS installer was not produced: $path"
          }
          "path=$((Resolve-Path $path).Path)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer for SignPath
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          retention-days: 1

      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $required = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure the GitHub Actions secret or variable '$name' before requesting a signature."
            }
          }

      - name: Submit installer to SignPath
        id: sign
        # SignPath action v3, pinned to its published commit.
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: true

      - name: Verify signed installer
        id: signed-installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem signed -Filter "*.exe" -File)
          if ($files.Count -ne 1) {
            throw "Expected one signed installer in the SignPath output directory; found $($files.Count)."
          }
          $signature = Get-AuthenticodeSignature $files[0].FullName
          if ($signature.Status -ne "Valid") {
            throw "Signed installer has an invalid Authenticode signature: $($signature.StatusMessage)"
          }
          "path=$($files[0].FullName)" >> $env:GITHUB_OUTPUT
          "signer=$($signature.SignerCertificate.Subject)" >> $env:GITHUB_OUTPUT

      - name: Upload signed installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.signed-installer.outputs.path }}
          archive: false
          retention-days: 30

      - name: Publish signed installer to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_PATH: ${{ steps.signed-installer.outputs.path }}
          APP_VERSION: ${{ steps.installer.outputs.version }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:INSTALLER_PATH" --title "Dark Wake $env:APP_VERSION" --generate-notes --verify-tag
